apiVersion: 1
datasources:
  - name: BESS Historian
    uid: bess-influx
    type: influxdb
    access: proxy
    url: ${INFLUX_URL}
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: bess-lab
      defaultBucket: bess
      timeInterval: 2s
    secureJsonData:
      # read-only token created by docker/influx-init (least privilege)
      token: $__file{/secrets/grafana.token}
