# ==================================================================================
# BESS SCADA lab - SIMPLE / DEMO mode: one flat network, no firewall, no VPN.
# Same devices, gateway, historian and dashboards with the same IP addresses, but all on
# one 10.10.0.0/16 segment. Works on any Docker host (Linux, macOS, Windows).
#   make demo        ->  http://localhost:3000
# This is also the "before segmentation" picture used in docs/iec62443.md.
# ==================================================================================
name: bess-lab-simple

x-app: &app
  build: {context: ., dockerfile: docker/app.Dockerfile}
  image: bess-lab/app:latest
  restart: unless-stopped
  cap_add: [NET_ADMIN]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: [/tmp]

networks:
  flat:
    driver: bridge
    ipam: {config: [{subnet: 10.10.0.0/16, gateway: 10.10.0.1, ip_range: 10.10.200.0/24}]}

volumes:
  influx-data:
  influx-config:
  influx-secrets:
  grafana-data:

services:
  field-sim:
    <<: *app
    command: ["python", "-m", "bess_lab.sim.server"]
    environment:
      SIM_SPEED: "${SIM_SPEED:-20}"
      NET_ALIASES: "10.10.10.11/16 10.10.10.12/16 10.10.10.13/16 10.10.10.14/16"
    sysctls: {net.ipv4.ip_unprivileged_port_start: "0"}
    networks: {flat: {ipv4_address: 10.10.10.10}}

  gateway:
    <<: *app
    command: ["python", "-m", "bess_lab.gateway.main"]
    environment:
      INFLUX_TOKEN_FILE: /secrets/gateway.token
      INFLUX_READ_TOKEN_FILE: /secrets/grafana.token
      INFLUX_URL: http://10.10.30.10:8086
      FAT_REPORT_DIR: /app/reports
    volumes:
      - influx-secrets:/secrets:ro
      - ./reports:/app/reports
    depends_on:
      field-sim: {condition: service_started}
      influxdb: {condition: service_healthy}
    networks: {flat: {ipv4_address: 10.10.20.10}}

  influxdb:
    image: influxdb:${INFLUXDB_VERSION:-2.7}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "mkdir -p /secrets && chown 1000:1000 /secrets && exec /entrypoint.sh influxd"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?set in .env}
      DOCKER_INFLUXDB_INIT_ORG: bess-lab
      DOCKER_INFLUXDB_INIT_BUCKET: bess
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN:?set in .env}
      INFLUXD_REPORTING_DISABLED: "true"
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
      - influx-secrets:/secrets
      - ./docker/influx-init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:8086:8086"]
    healthcheck:
      test: ["CMD-SHELL", "influx ping && test -s /secrets/gateway.token && test -s /secrets/grafana.token"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: {flat: {ipv4_address: 10.10.30.10}}

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.4.0}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_VIEWER:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bess-overview.json
      INFLUX_URL: http://10.10.30.10:8086
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - influx-secrets:/secrets:ro
    ports: ["3000:3000"]
    depends_on:
      influxdb: {condition: service_healthy}
    networks: {flat: {ipv4_address: 10.10.30.11}}
